server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Reverse proxy: the browser only ever talks to this same origin, which
    # avoids CORS entirely and means only ONE public URL needs to be shared
    # (works cleanly with GitHub Codespaces / Gitpod port forwarding).
    location /api/v1/ {
        proxy_pass http://backend:3000/api/v1/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Single-page app: any non-file route falls back to index.html so
    # React Router can handle client-side routing.
    location / {
        try_files $uri /index.html;
    }
}
